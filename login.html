<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrilhaGlobal | Entrar</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Configuração do Firebase -->
    <script src="js/Config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                linear-gradient(rgba(3, 27, 69, .76), rgba(8, 116, 237, .58)),
                url("imagens/banner.jpg") center/cover no-repeat;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, .97);
            border-radius: 18px;
            padding: 34px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, .25);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            margin: 0 auto 9px;
            border-radius: 50%;
            background: #0874ed;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .logo strong {
            display: block;
            color: #0754b8;
            font-size: 27px;
        }

        .logo small {
            display: block;
            color: #667085;
            font-size: 11px;
            margin-top: 4px;
        }

        h2 {
            text-align: center;
            color: #101a32;
            font-size: 22px;
            margin-bottom: 22px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #26344e;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d8e2ef;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
            color: #17233c;
        }

        input:focus {
            border-color: #0874ed;
            box-shadow: 0 0 0 3px rgba(8, 116, 237, .10);
        }

        .senha-area {
            position: relative;
        }

        .senha-area input {
            padding-right: 65px;
        }

        .mostrar-senha {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #0874ed;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .esqueci {
            display: block;
            text-align: right;
            margin-top: -6px;
            margin-bottom: 18px;
            color: #0874ed;
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-entrar {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 13px;
            background: #0874ed;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-entrar:hover {
            background: #075fc4;
        }

        .btn-entrar:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        #mensagem {
            display: none;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 12px;
            text-align: center;
            line-height: 1.4;
        }

        #mensagem.erro {
            display: block;
            background: #ffecec;
            color: #b42318;
        }

        #mensagem.sucesso {
            display: block;
            background: #e9f9ef;
            color: #087443;
        }

        .cadastro {
            text-align: center;
            margin-top: 20px;
            color: #667085;
            font-size: 12px;
        }

        .cadastro a,
        .voltar {
            color: #0874ed;
            font-weight: bold;
            text-decoration: none;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 13px;
            color: #667085;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <div class="logo-icon">✈</div>
            <strong>TrilhaGlobal</strong>
            <small>O mundo ao seu alcance</small>
        </div>

        <h2>Entrar na sua conta</h2>

        <form id="formLogin">

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>

                <div class="senha-area">
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="mostrar-senha"
                        onclick="mostrarSenha()"
                    >
                        Mostrar
                    </button>
                </div>
            </div>

            <a class="esqueci" onclick="recuperarSenha()">
                Esqueci minha senha
            </a>

            <div id="mensagem"></div>

            <button type="submit" class="btn-entrar" id="btnEntrar">
                Entrar
            </button>

        </form>

        <div class="cadastro">
            Ainda não possui uma conta?
            <a href="cadastro.html">Cadastre-se</a>
        </div>

        <a href="index.html" class="voltar">
            ← Voltar para o início
        </a>

    </div>

    <script>
        // ============================
        // FIREBASE
        // ============================

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        const formLogin = document.getElementById("formLogin");
        const mensagem = document.getElementById("mensagem");
        const btnEntrar = document.getElementById("btnEntrar");

        // ============================
        // MENSAGEM
        // ============================

        function mostrarMensagem(texto, tipo) {
            mensagem.textContent = texto;
            mensagem.className = tipo;
        }

        // ============================
        // MOSTRAR / OCULTAR SENHA
        // ============================

        function mostrarSenha() {
            const senha = document.getElementById("senha");
            const botao = document.querySelector(".mostrar-senha");

            if (senha.type === "password") {
                senha.type = "text";
                botao.textContent = "Ocultar";
            } else {
                senha.type = "password";
                botao.textContent = "Mostrar";
            }
        }

        // ============================
        // LOGIN
        // ============================

        formLogin.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            if (!email || !senha) {
                mostrarMensagem("Preencha o e-mail e a senha.", "erro");
                return;
            }

            btnEntrar.disabled = true;
            btnEntrar.textContent = "Entrando...";
            mensagem.className = "";

            try {
                const resultado = await auth.signInWithEmailAndPassword(
                    email,
                    senha
                );

                const usuario = resultado.user;

                mostrarMensagem(
                    "Login realizado com sucesso! Aguarde...",
                    "sucesso"
                );

                /*
                 * ADMINISTRADOR
                 *
                 * Coloque o e-mail do administrador abaixo.
                 * Troque pelo e-mail que você utilizará como administradora.
                 */

                const emailAdministrador = "maria@gmail.com";

                if (usuario.email.toLowerCase() === emailAdministrador.toLowerCase()) {

                    setTimeout(() => {
                        window.location.href = "administrador.html";
                    }, 1000);

                } else {

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                }

            } catch (erro) {

                console.error("Erro no login:", erro);

                let texto = "Não foi possível entrar.";

                switch (erro.code) {

                    case "auth/invalid-email":
                        texto = "Digite um e-mail válido.";
                        break;

                    case "auth/user-not-found":
                        texto = "Não existe uma conta cadastrada com este e-mail.";
                        break;

                    case "auth/wrong-password":
                    case "auth/invalid-credential":
                        texto = "E-mail ou senha incorretos.";
                        break;

                    case "auth/user-disabled":
                        texto = "Esta conta foi desativada.";
                        break;

                    case "auth/too-many-requests":
                        texto = "Muitas tentativas. Aguarde alguns minutos e tente novamente.";
                        break;

                    case "auth/network-request-failed":
                        texto = "Problema de conexão. Verifique sua internet.";
                        break;
                }

                mostrarMensagem(texto, "erro");

                btnEntrar.disabled = false;
                btnEntrar.textContent = "Entrar";
            }
        });

        // ============================
        // RECUPERAR SENHA
        // ============================

        async function recuperarSenha() {

            const email = document.getElementById("email").value.trim();

            if (!email) {
                mostrarMensagem(
                    "Digite seu e-mail primeiro para receber o link de recuperação.",
                    "erro"
                );
                document.getElementById("email").focus();
                return;
            }

            try {

                await auth.sendPasswordResetEmail(email);

                mostrarMensagem(
                    "Enviamos um link para redefinir sua senha. Verifique seu e-mail.",
                    "sucesso"
                );

            } catch (erro) {

                console.error(erro);

                let texto = "Não foi possível enviar o e-mail de recuperação.";

                if (erro.code === "auth/user-not-found") {
                    texto = "Não encontramos uma conta com esse e-mail.";
                }

                if (erro.code === "auth/invalid-email") {
                    texto = "Digite um e-mail válido.";
                }

                mostrarMensagem(texto, "erro");
            }
        }

        // ============================
        // SE JÁ ESTIVER LOGADO
        // ============================

        auth.onAuthStateChanged(function(user) {

            if (!user) return;

            const emailAdministrador = "maria@gmail.com";

            if (
                window.location.pathname.endsWith("login.html") &&
                user.email.toLowerCase() === emailAdministrador.toLowerCase()
            ) {
                // Não redireciona automaticamente aqui.
                // O usuário pode permanecer na tela de login até entrar novamente.
            }
        });
    </script>

</body>
</html>
